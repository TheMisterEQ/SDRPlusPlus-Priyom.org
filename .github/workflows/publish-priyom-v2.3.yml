name: Publish Priyom V2.3 release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-priyom-v2.3.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Package and publish V2.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s priyom.dll
          test -s source/priyom.cpp
          zip -q -r Priyom_V2.3_EN_Windows_x64.zip priyom.dll source README.md README_EN.md
          cat > release_notes.md <<'NOTES'
          ## Priyom V2.3 — English Edition

          An unofficial SDR++ extension for browsing and tracking numbers-station transmissions directly in the receiver.

          ### Highlights
          - Live schedules and countdowns in UTC from Priyom.org
          - QTH country names with graphical flags where provided
          - One-click frequency and mode tuning, with optional automatic tuning
          - Floating window and sidebar with resizable columns
          - Search, filters, adjustable opacity, and persistent configuration in one `priyom.ini`

          **Compatibility:** SDR++ 1.3.2 for Windows x64. SDR++ build-specific plugin interfaces may differ.

          ### Install
          Close SDR++, extract `priyom.dll` from the ZIP to SDR++'s `modules` folder, replacing any older Priyom DLL. Reopen SDR++ and enable the Priyom module.

          The package includes the plugin DLL, C++ source and documentation. GitHub also supplies automatic source archives for the release.

          This is an independent community project and is not affiliated with Priyom.org or SDR++.
          NOTES
          if gh release view v2.3 >/dev/null 2>&1; then
            echo "Release v2.3 already exists; not overwriting it."
            exit 0
          fi
          gh release create v2.3 priyom.dll Priyom_V2.3_EN_Windows_x64.zip --target "$GITHUB_SHA" --title "Priyom V2.3 — English (Windows x64)" --notes-file release_notes.md
